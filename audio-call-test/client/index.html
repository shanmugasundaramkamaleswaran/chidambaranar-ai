<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Call Test</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="panel">
        <h1>Audio Call Test</h1>

        <div id="join-panel" class="join-panel">
          <label>
            <span>Name</span>
            <input id="name-input" type="text" placeholder="Employee" />
          </label>

          <label>
            <span>Room ID</span>
            <input id="room-input" type="text" placeholder="TEST123" />
          </label>

          <label>
            <span>Role</span>
            <select id="role-select">
              <option value="Employee">Employee</option>
              <option value="Psychologist">Psychologist</option>
            </select>
          </label>

          <button id="join-btn" type="button">Join Room</button>
        </div>

        <div id="status-box" class="status-box">
          Waiting for room connection...
        </div>

        <div class="metrics">
          <div class="metric">
            <span>Local microphone</span>
            <strong id="mic-status">OFF</strong>
          </div>
          <div class="metric">
            <span>Remote audio</span>
            <strong id="remote-status">Waiting</strong>
          </div>
        </div>

        <div class="controls">
          <button id="mute-btn" class="secondary" type="button">🎤 Mute</button>
          <button id="end-btn" class="danger" type="button">📞 End Call</button>
        </div>

        <div id="error-box" class="error-box hidden"></div>
      </div>
    </div>

    <audio id="remote-audio" autoplay playsinline controls></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
